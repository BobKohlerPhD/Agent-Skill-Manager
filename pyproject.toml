[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-skill-manager"
version = "2.0.0"
description = "Repository-wide quality assurance for Agent Skills"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
asm = "agent_skill_manager.cli:main"

[tool.setuptools.packages.find]
include = ["agent_skill_manager*"]
